<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Night Pool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik+Glitch&family=Rubik+Dirt&family=Bungee&family=Metal+Mania&family=Orbitron:wght@700&family=VT323&family=Bebas+Neue&family=Creepster&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #1a1a24;
      --border: #2a2a3a;
      --text: #e0e0f0;
      --muted: #6b6b8a;
      --neon: #9b5cf6;
      --neon-glow: rgba(155, 92, 246, 0.4);
      --cyan: #06b6d4;
      --gold: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* HEADER */
    header {
      padding: 24px 20px 0;
      max-width: 900px;
      margin: 0 auto;
    }

    .app-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #fff 0%, var(--neon) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .app-sub {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 2px;
    }

    /* TABS */
    .tabs {
      display: flex;
      gap: 4px;
      padding: 20px 20px 0;
      max-width: 900px;
      margin: 0 auto;
    }

    .tab {
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      transition: all 0.2s;
      font-family: inherit;
    }

    .tab.active {
      background: var(--neon);
      border-color: var(--neon);
      color: #fff;
      box-shadow: 0 0 16px var(--neon-glow);
    }

    .tab.cash { border-color: var(--gold); color: var(--gold); }
    .tab.cash.active {
      background: var(--gold);
      color: #000;
      box-shadow: 0 0 16px rgba(245,158,11,0.4);
    }

    /* CONTROL BAR */
    .control-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 14px 20px 0;
      max-width: 900px;
      margin: 0 auto;
    }

    .btn-group {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .btn-group button {
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      white-space: nowrap;
    }

    .btn-group button + button { border-left: 1px solid var(--border); }

    .btn-group button.active {
      background: var(--surface2);
      color: var(--text);
    }

    .sort-group button.active { color: var(--neon); }

    .view-group button { font-size: 1rem; padding: 5px 12px; }
    .view-group button.active { color: var(--neon); }

    .spacer { flex: 1; }

    /* CATEGORY FILTERS */
    .filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      padding: 10px 20px 4px;
      max-width: 900px;
      margin: 0 auto;
    }

    .filter-chip {
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      transition: all 0.2s;
      font-family: inherit;
    }

    /* SECTION LABEL */
    .section-label {
      padding: 10px 20px 4px;
      max-width: 900px;
      margin: 0 auto;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* GRID VIEW */
    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      padding: 0 20px 100px;
      max-width: 900px;
      margin: 0 auto;
    }

    /* SCROLL VIEW */
    .events-grid.view-scroll {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 14px;
      padding-bottom: 100px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .events-grid.view-scroll .event-card {
      min-width: 240px;
      width: 240px;
      scroll-snap-align: start;
      flex-shrink: 0;
    }

    /* COMPACT VIEW */
    .events-grid.view-compact {
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: 0 20px 100px;
    }

    .events-grid.view-compact .event-card {
      border-radius: 0;
      border-left: none;
      border-right: none;
      border-top: none;
    }

    .events-grid.view-compact .event-card:first-child {
      border-radius: 10px 10px 0 0;
      border: 1px solid var(--border);
      border-bottom: none;
    }

    .events-grid.view-compact .event-card:last-child {
      border-radius: 0 0 10px 10px;
      border: 1px solid var(--border);
    }

    /* EVENT CARD */
    .event-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .event-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .view-compact .event-card:hover {
      transform: none;
      box-shadow: none;
      background: var(--surface2);
    }

    /* Full visual header — hidden in compact */
    .event-visual {
      height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
      overflow: hidden;
    }

    .view-compact .event-visual { display: none; }

    .event-visual::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
    }

    .event-visual-name {
      font-size: 1rem;
      font-weight: 800;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
      z-index: 1;
      line-height: 1.2;
    }

    .event-visual-cat {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 2px;
      z-index: 1;
      margin-top: 6px;
      opacity: 0.8;
    }

    .event-body {
      padding: 12px 14px;
    }

    /* In compact mode, make the body a flex row */
    .view-compact .event-body {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
    }

    .compact-color-bar {
      display: none;
      width: 3px;
      height: 36px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .view-compact .compact-color-bar { display: block; }

    .compact-main { flex: 1; min-width: 0; }

    .compact-name {
      display: none;
      font-size: 0.9rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .view-compact .compact-name { display: block; }
    .view-compact .event-meta { font-size: 0.72rem; }
    .view-compact .event-desc { display: none; }

    .event-meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .event-desc {
      font-size: 0.82rem;
      color: var(--text);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .event-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .view-compact .event-footer {
      margin-top: 0;
      flex-shrink: 0;
    }

    .price-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      color: var(--muted);
    }

    .price-badge.free { background: rgba(16,185,129,0.15); color: #10b981; }
    .price-badge.pwyc { background: rgba(6,182,212,0.12); color: var(--cyan); }

    .pool-badge {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(155,92,246,0.15);
      color: var(--neon);
      border: 1px solid rgba(155,92,246,0.3);
    }

    .version-count {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    /* EMPTY STATE */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; color: var(--text); }

    /* FAB */
    .fab {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--neon);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 14px 32px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 0 32px var(--neon-glow), 0 4px 20px rgba(0,0,0,0.5);
      transition: box-shadow 0.2s, transform 0.2s;
      text-decoration: none;
      white-space: nowrap;
    }

    .fab:hover {
      box-shadow: 0 0 48px var(--neon-glow), 0 6px 24px rgba(0,0,0,0.6);
      transform: translateX(-50%) translateY(-2px);
    }

    /* FLAG BUTTONS */
    .modal-flag-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 0 16px;
    }

    .flag-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .flag-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .flag-btn:hover:not(:disabled) {
      border-color: #ef4444;
      color: #ef4444;
      background: rgba(239,68,68,0.08);
    }

    .flag-btn.flagged {
      border-color: #ef4444;
      color: #ef4444;
      background: rgba(239,68,68,0.08);
      cursor: default;
    }

    .unflag-btn {
      background: transparent;
      border: 1px solid #ef4444;
      color: #ef4444;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      padding: 0;
      line-height: 1;
      font-family: inherit;
    }

    .unflag-btn:hover {
      background: rgba(239,68,68,0.15);
    }

    .flag-count { font-size: 0.78rem; color: var(--muted); }
    .flag-count.has-flags { color: #ef4444; }

    .flag-btn-sm {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }

    .flag-btn-sm:hover:not(:disabled) { border-color: #ef4444; color: #ef4444; }
    .flag-btn-sm.flagged { border-color: #ef4444; color: #ef4444; cursor: default; }

    .unflag-btn-sm {
      background: transparent;
      border: 1px solid #ef4444;
      color: #ef4444;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: all 0.15s;
      font-family: inherit;
    }

    .unflag-btn-sm:hover { background: rgba(239,68,68,0.15); }

    /* VERSIONS */
    .modal-versions { margin-top: 4px; padding-bottom: 8px; }

    .versions-toggle {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.82rem;
      cursor: pointer;
      padding: 8px 0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
      width: 100%;
    }

    .versions-toggle:hover { color: var(--text); }
    .versions-list { display: none; }
    .versions-list.open { display: block; }

    .version-item {
      background: var(--surface2);
      border-radius: 10px;
      padding: 12px;
      margin-top: 8px;
    }

    .version-item-date {
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .version-item-desc {
      font-size: 0.85rem;
      color: var(--text);
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .version-flag-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* UPDATE BUTTON */
    .modal-update-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(6,182,212,0.1);
      color: var(--cyan);
      border: 1px solid rgba(6,182,212,0.3);
      text-decoration: none;
      transition: background 0.2s;
      margin-bottom: 16px;
      cursor: pointer;
    }

    .modal-update-btn:hover { background: rgba(6,182,212,0.2); }

    /* MODAL */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open { display: flex; }

    @media (min-width: 600px) { .modal-backdrop { align-items: center; } }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }

    @media (min-width: 600px) {
      .modal {
        border-radius: 20px;
        transform: translateY(20px);
        opacity: 0;
        transition: transform 0.25s ease, opacity 0.25s ease;
      }
    }

    .modal-backdrop.open .modal { transform: translateY(0); opacity: 1; }

    .modal-drag-handle {
      width: 36px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 12px auto 0;
    }

    @media (min-width: 600px) { .modal-drag-handle { display: none; } }

    .modal-visual {
      height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
      margin: 12px 12px 0;
      border-radius: 12px;
    }

    .modal-visual::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
    }

    .modal-visual-name {
      font-size: 1.3rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
      z-index: 1;
      line-height: 1.2;
    }

    .modal-visual-cat {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 2px;
      z-index: 1;
      margin-top: 8px;
      opacity: 0.85;
    }

    .modal-body { padding: 20px; }

    .modal-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }

    .modal-icon { font-size: 1rem; width: 20px; flex-shrink: 0; margin-top: 1px; }

    .modal-row-content { font-size: 0.9rem; color: var(--text); line-height: 1.5; }
    .modal-row-label { font-size: 0.72rem; color: var(--muted); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 2px; }

    .modal-desc {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.6;
      padding: 14px;
      background: var(--surface2);
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .modal-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .modal-price-badge {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
    }

    .modal-price-badge.free { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
    .modal-price-badge.pwyc { background: rgba(6,182,212,0.12); color: var(--cyan); border: 1px solid rgba(6,182,212,0.3); }
    .modal-price-badge.paid { background: rgba(255,255,255,0.08); color: var(--muted); border: 1px solid var(--border); }

    .modal-source-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(155,92,246,0.12);
      color: var(--neon);
      border: 1px solid rgba(155,92,246,0.3);
      text-decoration: none;
      transition: background 0.2s;
    }

    .modal-source-btn:hover { background: rgba(155,92,246,0.22); }

    .modal-divider { height: 1px; background: var(--border); margin: 16px 0; }

    .modal-close {
      position: absolute;
      top: 16px; right: 16px;
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: none;
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 10;
    }

    .modal-close:hover { background: rgba(255,255,255,0.15); color: var(--text); }
  </style>
</head>
<body>

<header>
  <div class="app-title">Night Pool</div>
  <div class="app-sub">Trouve ce qui se passe vraiment ce soir.</div>
</header>

<div class="tabs">
  <button class="tab active" data-tab="pool">Pool</button>
  <button class="tab cash" data-tab="cash">Les gros plein de cash</button>
</div>

<!-- CONTROL BAR: sort / price filter / view toggle -->
<div class="control-bar" id="control-bar">
  <div class="btn-group sort-group">
    <button class="active" data-sort="aleatoire">Aléatoire</button>
    <button data-sort="date">Date</button>
    <button data-sort="recent">Récent</button>
  </div>
  <div class="btn-group">
    <button class="active" data-price="all">Tout</button>
    <button data-price="gratuit">Gratuit</button>
    <button data-price="pwyc">PWYC</button>
    <button data-price="payant">Payant</button>
  </div>
  <div class="spacer"></div>
  <div class="btn-group view-group">
    <button class="active" data-view="grid" title="Grille">⊞</button>
    <button data-view="scroll" title="Défilement">↔</button>
    <button data-view="compact" title="Liste compacte">≡</button>
  </div>
</div>

<div class="filters" id="filters">
  <button class="filter-chip active" data-cat="all">Tout</button>
  <button class="filter-chip" data-cat="Techno">Techno</button>
  <button class="filter-chip" data-cat="Électro">Électro</button>
  <button class="filter-chip" data-cat="Drum n Bass">Drum n Bass</button>
  <button class="filter-chip" data-cat="Rave">Rave</button>
  <button class="filter-chip" data-cat="Hip-Hop">Hip-Hop</button>
  <button class="filter-chip" data-cat="Punk">Punk</button>
  <button class="filter-chip" data-cat="Metal">Metal</button>
  <button class="filter-chip" data-cat="Indie / Rock">Indie / Rock</button>
  <button class="filter-chip" data-cat="Jazz">Jazz</button>
  <button class="filter-chip" data-cat="Blues">Blues</button>
  <button class="filter-chip" data-cat="Folk / Chanson">Folk / Chanson</button>
  <button class="filter-chip" data-cat="Soul / Funk">Soul / Funk</button>
  <button class="filter-chip" data-cat="Reggae / Ska">Reggae / Ska</button>
  <button class="filter-chip" data-cat="Classique">Classique</button>
  <button class="filter-chip" data-cat="Comedy">Comedy</button>
  <button class="filter-chip" data-cat="Théâtre / Perf.">Théâtre / Perf.</button>
  <button class="filter-chip" data-cat="Spoken Word">Spoken Word</button>
  <button class="filter-chip" data-cat="Open Mic">Open Mic</button>
  <button class="filter-chip" data-cat="Open Jam">Open Jam</button>
  <button class="filter-chip" data-cat="Arts visuels">Arts visuels</button>
  <button class="filter-chip" data-cat="Expérimental">Expérimental</button>
  <button class="filter-chip" data-cat="Autre">Autre</button>
</div>

<div class="section-label" id="section-label">Events de la communauté</div>
<div class="events-grid" id="events-grid"></div>

<a class="fab" href="submit.html">
  <span style="font-size:1.4rem;font-weight:300;line-height:1">+</span>
  Garoche ton event
</a>

<!-- EVENT MODAL -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal">
    <div class="modal-drag-handle"></div>
    <button class="modal-close" id="modal-close">✕</button>
    <div class="modal-visual" id="modal-visual">
      <div class="modal-visual-name" id="modal-visual-name"></div>
      <div class="modal-visual-cat" id="modal-visual-cat"></div>
    </div>
    <div class="modal-body">
      <div class="modal-badges" id="modal-badges"></div>
      <div class="modal-row">
        <div class="modal-icon">📅</div>
        <div>
          <div class="modal-row-label">Date & heure</div>
          <div class="modal-row-content" id="modal-date"></div>
        </div>
      </div>
      <div class="modal-row">
        <div class="modal-icon">📍</div>
        <div>
          <div class="modal-row-label">Lieu</div>
          <div class="modal-row-content" id="modal-venue"></div>
        </div>
      </div>
      <div class="modal-divider"></div>
      <div class="modal-desc" id="modal-desc"></div>
      <a class="modal-update-btn" id="modal-update-btn" href="#">📝 Poster une mise à jour</a>
      <div class="modal-flag-row" id="modal-flag-row"></div>
      <div class="modal-versions" id="modal-versions"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const { createClient } = supabase;
  const db = createClient(
    'https://wgewtmrtrygtroizhaxr.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndnZXd0bXJ0cnlndHJvaXpoYXhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNDM5OTAsImV4cCI6MjA5MzgxOTk5MH0.z9Qe-9NezVenudqhE8SU5kPae4cX6_i3cCDH6DpM864'
  );

  const CAT_COLORS = {
    'Techno': '#9b5cf6', 'Électro': '#06b6d4', 'Drum n Bass': '#a78bfa',
    'Rave': '#ec4899', 'Hip-Hop': '#ef4444', 'Punk': '#84cc16',
    'Metal': '#64748b', 'Indie / Rock': '#10b981', 'Jazz': '#f59e0b',
    'Blues': '#b45309', 'Folk / Chanson': '#65a30d', 'Soul / Funk': '#d97706',
    'Reggae / Ska': '#16a34a', 'Classique': '#94a3b8', 'Comedy': '#f97316',
    'Théâtre / Perf.': '#c026d3', 'Spoken Word': '#7c3aed',
    'Open Mic': '#fbbf24', 'Open Jam': '#34d399', 'Arts visuels': '#e879f9',
    'Expérimental': '#475569', 'Autre': '#94a3b8',
  };

  const FONT_FAMILIES = {
    'default':    'system-ui, sans-serif',
    'bebas':      "'Bebas Neue', sans-serif",
    'orbitron':   "'Orbitron', sans-serif",
    'bungee':     "'Bungee', sans-serif",
    'metal':      "'Metal Mania', cursive",
    'glitch':     "'Rubik Glitch', sans-serif",
    'dirty':      "'Rubik Dirt', sans-serif",
    'arcade':     "'Press Start 2P', monospace",
    'vt323':      "'VT323', monospace",
    'creepster':  "'Creepster', cursive",
  };

  const SAMPLE_CASH = [
    { id:'cash-1', name:'Loud Luxury', category:'Électro', subcat:'', date:'2026-05-16', time:'21:00', venue:'MTELUS, Montréal', price:'65$+', description:'Présenté par Evenko.', source:'https://evenko.ca', tab:'cash' },
    { id:'cash-2', name:'The Weeknd – After Hours Tour', category:'Hip-Hop', subcat:'', date:'2026-06-01', time:'20:00', venue:'Centre Bell, Montréal', price:'120$+', description:'Présenté par Live Nation / Ticketmaster.', source:'https://ticketmaster.ca', tab:'cash' },
    { id:'cash-3', name:'Igloofest Édition Spéciale', category:'Techno', subcat:'', date:'2026-05-22', time:'20:00', venue:'Quais du Vieux-Port', price:'40$+', description:'Présenté par Billet.ca.', source:'https://billet.ca', tab:'cash' },
  ];

  let activeTab        = 'pool';
  let activeCat        = 'all';
  let activeSort       = 'aleatoire';
  let activePriceFilter = 'all';
  let activeView       = 'grid';
  let poolGroups       = [];  // grouped, sorted by date
  let sortedCache      = [];  // after applying activeSort

  function getColor(cat) { return CAT_COLORS[cat] || '#94a3b8'; }

  function getFontFamily(fontId) {
    return FONT_FAMILIES[fontId] || FONT_FAMILIES['default'];
  }

  function formatDate(dateStr, timeStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('fr-CA', { weekday: 'short', month: 'short', day: 'numeric' })
           + (timeStr ? ' · ' + timeStr : '');
  }

  function formatDateShort(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('fr-CA', { month: 'short', day: 'numeric' });
  }

  function priceCategory(price) {
    const p = (price || '').toLowerCase().trim();
    if (!p || p === 'gratuit' || p === '0') return 'gratuit';
    if (p === 'pwyc') return 'pwyc';
    return 'payant';
  }

  function isExpired(ev) {
    const timeStr = ev.time || '23:59';
    const dt = new Date(`${ev.date}T${timeStr}:00`);
    dt.setHours(dt.getHours() + 4);
    return dt < new Date();
  }

  function groupEvents(events) {
    const map = {};
    events.forEach(ev => {
      const gid = ev.group_id || ev.id;
      if (!map[gid]) map[gid] = [];
      map[gid].push(ev);
    });
    Object.values(map).forEach(g =>
      g.sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
    );
    return Object.values(map).sort((a, b) => new Date(a[0].date) - new Date(b[0].date));
  }

  function shuffle(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function applySort(groups) {
    if (activeSort === 'aleatoire') return shuffle(groups);
    if (activeSort === 'date') return [...groups].sort((a, b) => new Date(a[0].date) - new Date(b[0].date));
    if (activeSort === 'recent') return [...groups].sort((a, b) => new Date(b[0].created_at) - new Date(a[0].created_at));
    return groups;
  }

  function filterGroups(groups) {
    let result = groups;

    // Hide expired events
    result = result.filter(g => !isExpired(g[0]));

    // Category
    if (activeCat !== 'all') {
      result = result.filter(g => g[0].category === activeCat);
    }

    // Price
    if (activePriceFilter !== 'all') {
      result = result.filter(g => priceCategory(g[0].price) === activePriceFilter);
    }

    return result;
  }

  function renderCard(group) {
    const ev = group[0];
    const rawColor = ev.visual_color || getColor(ev.category);
    const fontFamily = getFontFamily(ev.font);
    const catLabel = ev.subcat ? `${ev.category} · ${ev.subcat}` : ev.category;
    const pcat = priceCategory(ev.price);
    const isCash = ev.tab === 'cash';
    const gid = ev.group_id || ev.id;

    const versionBadge = group.length > 1
      ? `<span class="version-count">${group.length} versions</span>` : '';

    const rightBadge = isCash
      ? `<span class="pool-badge" style="border-color:rgba(245,158,11,0.3);color:var(--gold);background:rgba(245,158,11,0.1);">Billetterie</span>`
      : `<span class="pool-badge">Pool</span>`;

    const priceBadgeClass = pcat === 'gratuit' ? 'free' : pcat === 'pwyc' ? 'pwyc' : '';
    const priceLabel = pcat === 'gratuit' ? 'Gratuit' : pcat === 'pwyc' ? 'PWYC' : (ev.price || 'Payant');

    return `
      <div class="event-card" data-gid="${gid}">
        <div class="event-visual" style="background:${rawColor};">
          <div class="event-visual-name" style="font-family:${fontFamily}">${ev.name}</div>
          <div class="event-visual-cat">${catLabel.toUpperCase()}</div>
        </div>
        <div class="event-body">
          <div class="compact-color-bar" style="background:${rawColor};"></div>
          <div class="compact-main">
            <div class="compact-name">${ev.name}</div>
            <div class="event-meta">${formatDate(ev.date, ev.time)} · ${ev.venue}</div>
            <div class="event-desc">${ev.description || ''}</div>
          </div>
          <div class="event-footer">
            <span class="price-badge ${priceBadgeClass}">${priceLabel}</span>
            <div style="display:flex;gap:6px;align-items:center;">${versionBadge}${rightBadge}</div>
          </div>
        </div>
      </div>`;
  }

  function showLoading() {
    document.getElementById('events-grid').innerHTML =
      `<div class="empty"><div class="empty-icon">🌊</div><div class="empty-title">Chargement...</div></div>`;
  }

  function renderGrid(groups) {
    const filtered = filterGroups(groups);
    const grid = document.getElementById('events-grid');

    // Update view class
    grid.className = 'events-grid';
    if (activeView === 'scroll') grid.classList.add('view-scroll');
    if (activeView === 'compact') grid.classList.add('view-compact');

    if (filtered.length === 0) {
      grid.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🌑</div>
          <div class="empty-title">Rien ici pour l'instant</div>
          <div>Sois le premier à garocher un event.</div>
        </div>`;
    } else {
      grid.innerHTML = filtered.map(renderCard).join('');
      grid.querySelectorAll('.event-card').forEach(card => {
        card.addEventListener('click', () => {
          const gid = card.dataset.gid;
          const src = activeTab === 'pool' ? sortedCache : SAMPLE_CASH.map(e => [e]);
          const group = src.find(g => (g[0].group_id || g[0].id) === gid);
          if (group) openModal(group);
        });
      });
    }

    document.getElementById('section-label').textContent =
      activeTab === 'pool' ? 'Events de la communauté' : 'Billetterie officielle';

    // Update category chip styles
    document.querySelectorAll('.filter-chip').forEach(chip => {
      const cat = chip.dataset.cat;
      if (chip.classList.contains('active')) {
        if (cat !== 'all') {
          const c = getColor(cat);
          chip.style.cssText = `background:${c}22;color:${c};border-color:${c}`;
        } else {
          chip.style.cssText = 'background:rgba(155,92,246,0.15);color:#9b5cf6;border-color:#9b5cf6';
        }
      } else {
        chip.style.cssText = '';
      }
    });
  }

  async function loadPool() {
    showLoading();
    const { data, error } = await db.from('events').select('*').order('date', { ascending: true });
    if (error) {
      document.getElementById('events-grid').innerHTML =
        `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">Impossible de charger les events</div></div>`;
      return;
    }
    poolGroups = groupEvents(data || []);
    sortedCache = applySort(poolGroups);
    renderGrid(sortedCache);
  }

  function render() {
    if (activeTab === 'pool') {
      loadPool();
    } else {
      sortedCache = SAMPLE_CASH.map(e => [e]);
      renderGrid(sortedCache);
    }
  }

  // TABS
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      activeTab = tab.dataset.tab;
      activeCat = 'all';
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      document.querySelector('.filter-chip[data-cat="all"]').classList.add('active');
      render();
    });
  });

  // SORT
  document.querySelectorAll('.sort-group button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.sort-group button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeSort = btn.dataset.sort;
      sortedCache = applySort(activeTab === 'pool' ? poolGroups : SAMPLE_CASH.map(e => [e]));
      renderGrid(sortedCache);
    });
  });

  // PRICE FILTER
  document.querySelectorAll('[data-price]').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.closest('.btn-group').querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activePriceFilter = btn.dataset.price;
      renderGrid(sortedCache);
    });
  });

  // VIEW TOGGLE
  document.querySelectorAll('[data-view]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-view]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeView = btn.dataset.view;
      renderGrid(sortedCache);
    });
  });

  // CATEGORY CHIPS
  document.querySelectorAll('.filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeCat = chip.dataset.cat;
      renderGrid(sortedCache);
    });
  });

  // ─── FLAG / UNFLAG ───────────────────────────────────────────────────────────

  async function flagVersion(eventId, container) {
    const key = `flagged_${eventId}`;
    if (localStorage.getItem(key)) return;

    const flagBtn = container.querySelector(`[data-flag="${eventId}"]`);
    if (flagBtn) { flagBtn.disabled = true; flagBtn.textContent = '…'; }

    const { data } = await db.from('events').select('flags').eq('id', eventId).single();
    const newFlags = (data?.flags || 0) + 1;
    const { error } = await db.from('events').update({ flags: newFlags }).eq('id', eventId);
    if (error) {
      if (flagBtn) { flagBtn.disabled = false; flagBtn.textContent = '🚩 Signaler'; }
      return;
    }

    localStorage.setItem(key, '1');
    updateFlagUI(container, eventId, newFlags, true);
    // Update in-memory
    poolGroups.forEach(g => { const ev = g.find(e => e.id === eventId); if (ev) ev.flags = newFlags; });
    sortedCache.forEach(g => { const ev = g.find(e => e.id === eventId); if (ev) ev.flags = newFlags; });
  }

  async function unflagVersion(eventId, container) {
    const key = `flagged_${eventId}`;
    if (!localStorage.getItem(key)) return;

    const { data } = await db.from('events').select('flags').eq('id', eventId).single();
    const newFlags = Math.max(0, (data?.flags || 0) - 1);
    const { error } = await db.from('events').update({ flags: newFlags }).eq('id', eventId);
    if (error) return;

    localStorage.removeItem(key);
    updateFlagUI(container, eventId, newFlags, false);
    poolGroups.forEach(g => { const ev = g.find(e => e.id === eventId); if (ev) ev.flags = newFlags; });
    sortedCache.forEach(g => { const ev = g.find(e => e.id === eventId); if (ev) ev.flags = newFlags; });
  }

  function updateFlagUI(container, eventId, flagCount, isFlagged) {
    const flagBtn   = container.querySelector(`[data-flag="${eventId}"]`);
    const unflagBtn = container.querySelector(`[data-unflag="${eventId}"]`);
    const countEl   = container.querySelector(`[data-fcount="${eventId}"]`);

    if (flagBtn) {
      flagBtn.classList.toggle('flagged', isFlagged);
      flagBtn.classList.toggle('flag-btn-sm', flagBtn.classList.contains('flag-btn-sm'));
      flagBtn.textContent = isFlagged ? '🚩 Signalé' : '🚩 Signaler';
      flagBtn.disabled = isFlagged;
    }

    if (unflagBtn) unflagBtn.style.display = isFlagged ? '' : 'none';
    if (countEl) {
      countEl.textContent = flagCount > 0 ? `${flagCount} flag${flagCount > 1 ? 's' : ''}` : '';
      countEl.classList.toggle('has-flags', flagCount > 0);
    }
  }

  function makeFlagHTML(ev, sm = false) {
    const flagged = !!localStorage.getItem(`flagged_${ev.id}`);
    const flags = ev.flags || 0;
    const cls = sm ? 'flag-btn-sm' : 'flag-btn';
    const unflagCls = sm ? 'unflag-btn-sm' : 'unflag-btn';
    return `
      <button class="${cls}${flagged ? ' flagged' : ''}" data-flag="${ev.id}"${flagged ? ' disabled' : ''}>
        ${flagged ? '🚩 Signalé' : '🚩 Signaler'}
      </button>
      <button class="${unflagCls}" data-unflag="${ev.id}" style="${flagged ? '' : 'display:none'}" title="Retirer mon signalement">×</button>
      <span class="flag-count${flags > 0 ? ' has-flags' : ''}" data-fcount="${ev.id}">
        ${flags > 0 ? `${flags} flag${flags > 1 ? 's' : ''}` : ''}
      </span>`;
  }

  function bindFlagBtns(container) {
    container.querySelectorAll('[data-flag]').forEach(btn => {
      btn.addEventListener('click', function() {
        flagVersion(this.dataset.flag, container);
      });
    });
    container.querySelectorAll('[data-unflag]').forEach(btn => {
      btn.addEventListener('click', function() {
        unflagVersion(this.dataset.unflag, container);
      });
    });
  }

  // ─── MODAL ───────────────────────────────────────────────────────────────────

  function openModal(group) {
    const ev = group[0];
    const rawColor = ev.visual_color || getColor(ev.category);
    const fontFamily = getFontFamily(ev.font);
    const catLabel = ev.subcat ? `${ev.category} · ${ev.subcat}` : ev.category;
    const pcat = priceCategory(ev.price);
    const isCash = ev.tab === 'cash';
    const gid = ev.group_id || ev.id;

    document.getElementById('modal-visual').style.background = rawColor;
    document.getElementById('modal-visual-name').style.fontFamily = fontFamily;
    document.getElementById('modal-visual-name').textContent = ev.name;
    document.getElementById('modal-visual-cat').textContent = catLabel.toUpperCase();
    document.getElementById('modal-date').textContent = formatDate(ev.date, ev.time);
    document.getElementById('modal-venue').textContent = ev.venue;
    document.getElementById('modal-desc').textContent = ev.description || '';

    // Badges
    let badgesHTML = '';
    if (pcat === 'gratuit') {
      badgesHTML += `<span class="modal-price-badge free">✓ Gratuit</span>`;
    } else if (pcat === 'pwyc') {
      badgesHTML += `<span class="modal-price-badge pwyc">PWYC</span>`;
    } else {
      badgesHTML += `<span class="modal-price-badge paid">${ev.price || 'Payant'}</span>`;
    }
    badgesHTML += isCash
      ? `<span class="modal-price-badge paid" style="color:var(--gold);border-color:rgba(245,158,11,0.3);background:rgba(245,158,11,0.08);">Billetterie</span>`
      : `<span class="modal-price-badge paid" style="color:var(--neon);border-color:rgba(155,92,246,0.3);background:rgba(155,92,246,0.08);">Pool</span>`;
    if (ev.source) {
      badgesHTML += `<a href="${ev.source}" target="_blank" rel="noopener" class="modal-source-btn">↗ Source</a>`;
    }
    document.getElementById('modal-badges').innerHTML = badgesHTML;

    // "Poster une mise à jour" button (pool only)
    const updateBtn = document.getElementById('modal-update-btn');
    if (!isCash) {
      updateBtn.href = `submit.html?group_id=${encodeURIComponent(gid)}&name=${encodeURIComponent(ev.name)}`;
      updateBtn.style.display = '';
    } else {
      updateBtn.style.display = 'none';
    }

    // Flag row (pool only)
    const flagRow = document.getElementById('modal-flag-row');
    if (!isCash && ev.id) {
      flagRow.innerHTML = `<div class="flag-actions">${makeFlagHTML(ev, false)}</div>`;
      flagRow.style.display = 'flex';
      bindFlagBtns(flagRow);
    } else {
      flagRow.style.display = 'none';
      flagRow.innerHTML = '';
    }

    // Older versions
    const versionsEl = document.getElementById('modal-versions');
    if (group.length > 1) {
      const older = group.slice(1);
      versionsEl.innerHTML = `
        <button class="versions-toggle">
          <span class="v-arrow">▸</span>
          ${older.length} version${older.length > 1 ? 's' : ''} antérieure${older.length > 1 ? 's' : ''}
        </button>
        <div class="versions-list">
          ${older.map(v => {
            const d = new Date(v.created_at);
            const lbl = d.toLocaleDateString('fr-CA', { month: 'short', day: 'numeric' })
                      + ' ' + d.toLocaleTimeString('fr-CA', { hour: '2-digit', minute: '2-digit' });
            return `
              <div class="version-item">
                <div class="version-item-date">Soumis le ${lbl}</div>
                <div class="version-item-desc">${v.description || ''}</div>
                <div class="version-flag-row">${makeFlagHTML(v, true)}</div>
              </div>`;
          }).join('')}
        </div>`;

      const toggle = versionsEl.querySelector('.versions-toggle');
      const list   = versionsEl.querySelector('.versions-list');
      const arrow  = versionsEl.querySelector('.v-arrow');
      toggle.addEventListener('click', () => {
        list.classList.toggle('open');
        arrow.textContent = list.classList.contains('open') ? '▾' : '▸';
      });
      bindFlagBtns(versionsEl);
    } else {
      versionsEl.innerHTML = '';
    }

    document.getElementById('modal-backdrop').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('modal-backdrop').classList.remove('open');
    document.body.style.overflow = '';
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-backdrop').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-backdrop')) closeModal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  render();
</script>
</body>
</html>
